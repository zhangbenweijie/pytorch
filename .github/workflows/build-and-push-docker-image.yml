name: Create and publish a Docker image

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-image:
    name: Build and push Docker image to Harbor
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Add Harbor hostname to /etc/hosts
        env:
          REGISTRY_HOSTIP: ${{ secrets.REGISTRY_HOSTIP }}
          REGISTRY_HOSTNAME: ${{ secrets.REGISTRY_HOSTNAME }}
        if: ${{ env.REGISTRY_HOSTIP != '' && env.REGISTRY_HOSTNAME != '' }}
        run: |
          echo "${REGISTRY_HOSTIP} ${REGISTRY_HOSTNAME}" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOSTNAME || 'docker.io' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.REGISTRY_HOSTNAME || 'docker.io' }}/${{ secrets.REGISTRY_USERNAME }}/${{ secrets.REGISTRY_REPONAME || github.event.repository.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=LLaVA-v1.5 research environment
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build and push Docker Schema 2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          provenance: false
          sbom: false
          outputs: |
            type=image,push=true,oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
